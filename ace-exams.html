, "in", "on", "away"], "reason": "Check out of a hotel otelden ayrılış işlemi yapmak demektir.", "level": "A2"}, {"unit": 4, "stem": "“Have you got plans for Friday?” “Yes, I ___ my cousins at seven.”", "options": ["’m meeting", "meet usually", "met", "have meet"], "reason": "Saat verilmiş kişisel düzenleme için present continuous uygundur.", "level": "A2"}, {"unit": 4, "stem": "It’s only a small gathering. Would you like to come ___ for dinner?", "options": ["over", "out of", "up to", "down on"], "reason": "Come over birinin evine uğramak demektir.", "level": "A2"}, {"unit": 5, "stem": "Staff ___ wear an ID badge. It’s a company rule.", "options": ["have to", "might", "don’t have to", "would rather"], "reason": "Have to dışarıdan gelen zorunluluğu belirtir.", "level": "A2"}, {"unit": 5, "stem": "I’m responsible ___ preparing the weekly report.", "options": ["for", "of", "to", "at"], "reason": "Responsible for + -ing.", "level": "A2"}, {"unit": 6, "stem": "“I feel tired all the time.” “You ___ go to bed earlier.”", "options": ["should", "would to", "mustn’t to", "could to"], "reason": "Should ile tavsiye verilir.", "level": "A2"}, {"unit": 6, "stem": "I go cycling twice a week to ___ fit.", "options": ["keep", "do", "stay in", "make"], "reason": "Keep fit doğal bir kalıptır.", "level": "A2"}, {"unit": 7, "stem": "My sister ___ live near the station, but now she lives abroad.", "options": ["used to", "is used to", "uses to", "would to"], "reason": "Used to artık geçerli olmayan geçmiş durumları anlatır.", "level": "A2"}, {"unit": 7, "stem": "Tom couldn’t work out the instructions. He looked ___.", "options": ["confused", "relaxed", "pleased", "cheerful"], "reason": "Talimatları anlayamadığında confused hissedebilir.", "level": "A2"}, {"unit": 8, "stem": "The children made the costumes by ___.", "options": ["themselves", "them", "their", "itself"], "reason": "Çoğul özne için reflexive pronoun themselves.", "level": "A2"}, {"unit": 8, "stem": "If the exhibition closes const passages = {
 A1:['Hi, I’m Ava. I work at a hotel. I start at eight on Monday, and I take the bus to work.','How does Ava go to work?','By bus|By train|By car|On foot','Hi Sam. The bookshop is closed today. Let’s meet at the café at three instead.','Where will they meet?','At the café|At the bookshop|At the hotel|At the station'],

const byId = id => document.getElementById(id);
let items=[], answers=[], position=0, deadline=0, timer=0, writing='';
function shuffle(values){
 const out=[...values];
 for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
 return out;
}
function addSkills(level,form){
 const p=passages[level], keys=form===0?p:[
  'The library closes at four today. You can return books after four using the box by the door.',
  'How can you return a book after four?', 'Use the box outside|Wait for the librarian|Go to the café|Leave it on a desk',
  'Hi Jo. I’ve moved our meeting from the station to the bus stop by the park. The time is still two.',
  'What changed?', 'The meeting place|The meeting time|The day|The person coming'
 ];
 return [0,3].map((i)=>({
  level, unit: level==='A2'?3:level==='A1+'?7:12, stem:keys[i+1],
  options:keys[i+2].split('|'), script:keys[i], type:i===0?'Reading':'Listening',
  reason:'Metindeki ilgili bilgi: '+keys[i+2].split('|')[0]+'.'
 }));
}
function describe(){
 byId('description').textContent=byId('mode').value==='placement'
 ? '36 soru · 35 dakika · A1 → A1+ → A2. Sonuç bir çalışma aralığı önerir.'
 : '14 soru · 20 dakika · Dil kullanımı, okuma ve dinleme. Sonuçta isteğe bağlı yazma ve konuşma görevi var.';
}
byId('mode').onchange=describe;describe();
byId('start').onclick=()=>{
 const form=Number(byId('form').value)-1;
 const level=byId('mode').value;
 const levels=level==='placement'?['A1','A1+','A2']:[level];
 items=levels.flatMap(l=>{
  const selected=bank[l].filter((_,i)=>i%2===form);
  return level==='placement'?selected:[...selected,...addSkills(l,form)];
 }).map(q=>({...q,correct:q.options[0],options:shuffle(q.options)}));
 answers=items.map(()=>null);position=0;writing='';deadline=Date.now()+(level==='placement'?35:20)*60000;

};
function tick(){
 const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));

function node(tag,text,parent){
 const el=document.createElement(tag);el.textContent=text;parent.append(el);return el;
}
function render(){
 const q=items[position], box=byId('question');
 box.replaceChildren();byId('progress').textContent=(position+1)+' / '+items.length+' · '+q.level+' · '+(q.type||'Use of English');
 if(q.type==='Reading')node('p',q.script,box).className='reading';
 if(q.type==='Listening'){
  const play=node('button','Dinle',box);
  play.onclick=()=>{
   if(!('speechSynthesis' in window)){play.textContent='Bu tarayıcıda ses desteği yok';return;}
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(q.script);u.lang='en-GB';u.rate=.87;speechSynthesis.speak(u);
  };
 }
 const f=node('fieldset','',box);node('legend',q.stem,f);
 q.options.forEach(o=>{
  const l=node('label','',f);l.className='option';
  const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[position]===o;
  input.onchange=()=>{answers[position]=o;renderJump();};
  l.append(input,document.createTextNode(' '+o));
 });
 byId('prev').disabled=position===0;byId('next').disabled=position===items.length-1;renderJump();
}
function renderJump(){
 const box=byId('jump');box.replaceChildren();

  const b=node('button',String(i+1),box);
  if(answers[i]!==null)b.className='answered';
  b.setAttribute('aria-current',String(i===position));
  b.onclick=()=>{position=i;render();};
 });
}
byId('prev').onclick=()=>{position--;render();};
byId('next').onclick=()=>{position++;render();};
byId('finish').onclick=()=>{
 const missing=answers.filter(a=>a===null).length;
 if(confirm(missing?missing+' soru boş. Sınavı bitir?':'Sınavı bitir?'))finish();
};
function finish(){
 clearInterval(timer);
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const box=byId('results');box.replaceChildren();
 byId('exam').hidden=true;box.hidden=false;
 const tally={};let total=0;
 items.forEach((q,i)=>{
  const t=tally[q.level]??={right:0,count:0};t.count++;
  if(q.correct===answers[i]){t.right++;total++;}
 });
 node('h2',total+' / '+items.length+' doğru · %'+Math.round(100*total/items.length),box);
 const placement=byId('mode').value==='placement';
 let recommendation='A1 temellerini tekrar et';
 for(const [level,t] of Object.entries(tally)){
  node('p',level+' · '+t.right+'/'+t.count,box);
  if(placement && t.right/t.count<.75)break;
  recommendation=level==='A2'?'A2 konularında güçlü sonuç':level+' konularında güçlü sonuç';
 }
 if(placement){

  }

 }

 items.forEach((q,i)=>{

  node('p','Senin cevabın: '+(answers[i]||'Boş')+' · Doğru: '+q.correct,entry);
  node('p',q.reason,entry);
  node('p',(q.level==='A2'?'Language Hub':'Müfredat')+' · '+q.level+' Ünite '+q.unit+' — '+topics[q.level][q.unit-1],entry);
 });
 if(total===items.length)node('p','Yanlış veya boş cevap yok.',review);
 if(!placement){
  const level=byId('mode').value;
  const prompts={A1:['Bir arkadaşına kendini ve günlük rutinini 4–5 cümleyle tanıt.','Kendini tanıt ve hafta sonu planını söyle.'], 'A1+':['Bir arkadaşına hafta sonu gezini anlatan kısa bir e-posta yaz.','Bir şehir gezisini anlat ve bir ulaşım önerisi yap.'], A2:['Bir arkadaşına 50–100 kelimelik gezi tavsiyesi e-postası yaz. Yer, ulaşım ve görülecek şeylerden bahset.','Karşılaştırarak konuş: Seyahatte tablet mi dizüstü bilgisayar mı? Bir öneri ve iki gerekçe ver.']};
  node('h3','Yazma ve konuşma pratiği',box);
  node('p','Yazma · '+prompts[level][0],box);
  const draft=node('textarea','',box);draft.rows=5;draft.setAttribute('aria-label','Yazma taslağı');draft.value=writing;draft.oninput=()=>{writing=draft.value;};
  node('p','Konuşma · '+prompts[level][1],box);
  node('p','Öz kontrol: Görevin bütün noktalarına değindin mi? Zamanlar tutarlı mı? En az bir ayrıntı veya gerekçe verdin mi?',box);
 }
 const again=node('button','Başka deneme seç',box);again.onclick=()=>{box.hidden=true;byId('setup').hidden=false;window.scrollTo(0,0);};
 window.scrollTo(0,0);
}
