t, but there’s ___ umbrella inside.", "options": ["an", "a", "some", "any"], "reason": "Umbrella ünlü sesle başlar ve tekildir.", "level": "A1+"}, {"unit": 2, "stem": "“Could you open the window?” “___ It’s really warm in here.”", "options": ["Of course.", "Not right now.", "I’d rather keep it closed.", "Sorry, I can’t reach it."], "reason": "İkinci cümle, pencereyi açmayı kabul etme nedenini veriyor.", "level": "A1+"}, {"unit": 3, "stem": "He ___ cooks on weekdays. He usually gets a takeaway instead.", "options": ["hardly ever", "always", "usually", "often"], "reason": "Alternatif olarak genellikle hazır yemek alması, pek az yemek yaptığını gösterir.", "level": "A1+"}, {"unit": 3, "stem": "I work from home ___ Mondays, but today I’m at the office.", "options": ["on", "at", "in", "by"], "reason": "Haftanın günlerinde on kullanılır.", "level": "A1+"}, {"unit": 4, "stem": "“What ___ your sister do?” “She teaches at a primary school.”", "options": ["does", "do", "is", "has"], "reason": "Mesleğini sormak için What does … do?", "level": "A1+"}, {"unit": 5, "stem": "The café is ___ the bookshop and the chemist’s.", "options": ["between", "opposite", "across", "along"], "reason": "Between A and B iki konum arasını anlatır.", "level": "A1+"}, {"unit": 5, "stem": "“___ any public toilets near here?” “Yes, behind the market.”", "options": ["Are there", "Is there", "There are", "Do they"], "reason": "Çoğul toilets ile soru Are there…?", "level": "A1+"}, {"unit": 6, "stem": "I didn’t ___ the ending because I left the cinema early.", "options": ["see", "saw", "seen", "seeing"], "reason": "Didn’t sonrasında yalın fiil kullanılır.", "level": "A1+"}, {"unit": 7, "stem": "We missed our train, so we ___ a later one.", "options": ["took", "take", "taken", "taking"], "reason": "Bitmiş geçmiş olay için took.", "level": "A1+"}, {"unit": 7, "stem": "“Does this bus go to the airport?” “No, you need to ___ at Central Station.”", "options": ["change", "get on", "set off", "check in"], "reaso  "Olumsuz cümlede herhangi bir kişi için anyone.", "level": "A2"}, {"unit": 2, "stem": "I ___ dinner when the lights went out.", "options": ["was cooking", "cooked", "have cooked", "had cooked"], "reason": "Elektrik kesildiğinde yemek yapma eylemi sürüyordu.", "level": "A2"}, {"unit": 2, "stem": "It took me a few days to ___ after moving into the new flat.", "options": ["settle in", "move out", "drop by", "check out"], "reason": "Yeni bir yere alışmak settle in.", "level": "A2"}, {"unit": 3, "stem": "We’ve ___ missed the last bus. What should we do now?", "options": ["just", "yesterday", "last night", "ago"], "reason": "Present perfect ile çok yakın geçmiş için just kullanılır.", "level": "A2"}, {"unit": 3, "stem": "We’ve only booked the room until Friday, so we need to ___ by eleven that morning.", "options": ["check out", "check in", "drop off", "set off"], "reason": "Rezervasyonun bittiği gün yapılan çıkış işlemi check out.", "level": "A2"}, {"unit": 4, "stem": "“Can we have lunch tomorrow?” “Sorry, I ___ my tutor at one. How about Friday?”", "options": ["’m meeting", "meet", "met", "have met"], "reason": "Saati belirlenmiş kişisel düzenleme için present continuous.", "level": "A2"}, {"unit": 5, "stem": "“Can I wear trainers to work?” “Yes, you ___ wear formal shoes.”", "options": ["don’t have to", "have to", "ought to", "must"], "reason": "Spor ayakkabı serbestse resmî ayakkabı zorunlu değildir.", "level": "A2"}, {"unit": 5, "stem": "I’m responsible ___ sending the weekly report to our clients.", "options": ["for", "of", "to", "with"], "reason": "Responsible for + isim ya da -ing.", "level": "A2"}, {"unit": 6, "stem": "I go swimming on Tuesdays and walk to work to ___ fit.", "options": ["keep", "get on", "fall out", "make up"], "reason": "Keep fit, formda kalmak demektir.", "level": "A2"}, {"unit": 7, "stem": "I ___ have a long journey to work, but now I live nearby.", "options": ["used to", "am used to", "get used to", "didn’t use to"], "reason": "Geçmişte uzun ds. See you in class!"]}, "A1+": {"read": "On Saturday our group is visiting the old town. The guided walk was going to start at the station, but roadworks mean we’ll meet in front of the museum at 9:30 instead. The ticket includes entry to the museum. If you want lunch at the museum café, order before the walk. There’s also a small park nearby where you can eat your own food. It may rain, so bring a light jacket.", "listen": "Hi Maya, it’s Jo. I found a jacket for our walking trip. The blue one was cheaper, but it wasn’t waterproof, so I chose the grey one. The shop didn’t have my size, so they’re sending it to my home on Thursday. Could you bring the map on Saturday? I’ve already got the water bottles.", "r": [["Where should the group meet?", "In front of the museum|At the station|Inside the café|At the park entrance", "Roadworks changed the meeting point to the museum entrance."], ["What does the ticket cover?", "Museum entry|Lunch at the café|A jacket|Travel to the museum", "Entry is included; lunch is ordered separately."], ["What should you do if you want lunch from the café?", "Order before the walk.|Order at the station.|Order after visiting the park.|Order on the way home.", "The notice asks café customers to order before the walk."], ["Why is a jacket useful?", "It might rain.|The museum is cold.|You need it to enter.|The café has no seats.", "The final sentence mentions possible rain."]], "l": [["Why did Jo choose the grey jacket?", "It was waterproof.|It was cheaper.|It was in the right size at the shop.|It was lighter.", "Jo rejected the cheaper blue jacket because it wasn’t waterproof."], ["When is delivery expected?", "Thursday|Saturday|Wednesday|Friday", "Saturday is the trip; Thursday is the delivery."], ["What does Jo want Maya to bring?", "The map|The jacket|The water bottles|The tickets", "Jo asks for the map."], ["Why isn’t Jo taking the jacket home from the shop?", "The shop didn’t have the right size.|The jacket was too expensive.|It was only on sale on Thursday.|The shop had already closed.", "The shop didn’t have Jo’s size."]], "write": ["50–70", "Write an informal email to a friend about a recent day trip.", "Say where you went and how you got there.|Describe one thing you did and give your opinion.|Suggest a place you could visit together next time.", "Hi Mina, Last Sunday I went to a town near Ankara with a friend. We went by train and walked from the station to the old market. The market was busy, but I really enjoyed trying the local food. Next time, we could go to a museum together. Would you like to come? See you, Selin"]}, "A2": {"read": "Last spring the Brookfield Park path was closed for repairs. The council planned to reopen it in June, but residents noticed that the old route passed through an area where ducks were nesting. After meeting local volunteers, the council decided to move part of the path farther from the lake. The new route takes five minutes longer, but it has a better view and a smoother surface. Some cyclists complained about the extra distance. However, the owner of a nearby café said more families had stopped there since the path reopened. Signs will be added next month, as some walkers are still following the old route.", "listen": "Good afternoon. This is a message for people who booked Saturday’s photography walk. The weather forecast is fine, so the walk is going ahead. However, the road beside the harbour is closed, and we’ll meet outside the main entrance to the museum instead. Please arrive at a quarter to ten so we can leave at ten. There’s no need to bring a professional camera. A phone is fine. If you borrowed a camera from us last week, please return it to the office on Friday, as the office won’t be open on Saturday morning.", "r": [["Why did the council move part of the route?", "To avoid disturbing nesting ducks|To make the route shorter|To give cyclists a faster route|To create more space for the café", "Residents identified nesting ducks near the original route."], ["How does the new route compare with the old one?", "It takes longer but is easier to walk on.|It’s shorter but has poorer views.|It’s the same length but closer to the lake.|It takes longer because its surface is rougher.", "The text says five minutes longer and smoother."], ["What change did the café owner notice?", "More families stopped at the café.|Fewer residents used the park.|More cyclists complained in the café.|Volunteers began opening the café on weekends.", "The owner reports more families stopping there."], ["Why will the council add signs?", "Some walkers still use the old route.|The council plans to close the lake.|Cyclists can’t see the café.|Families need to find the volunteers.", "The last sentence explains the reason for adding signs."]], "l": [["Why has the meeting point changed?", "A road is closed.|The weather forecast is bad.|The museum is closed.|There aren’t enough cameras.", "The harbour road closure caused the change."], ["When should participants get there?", "9:45|10:00|10:15|9:15", "A quarter to ten is 9:45. The group leaves at ten."], ["What equipment is acceptable?", "A phone|Only a professional camera|Only a borrowed camera|A camera and a phone together", "The organiser explicitly says a phone is fine."], ["Why should borrowed cameras be returned by Friday?", "The office will be closed on Saturday morning.|The walk has moved to Friday.|The organiser needs them during the walk.|The museum has stopped lending cameras.", "The office won’t open on Saturday morning."]], "write": ["80–100", "A friend is visiting your town for the first time. Write an email suggesting one place to visit.", "Say where it is and how to get there.|Describe two things your friend can do or see there.|Give one practical tip and explain why.", "Hi Alex, If you have a free afternoon in Ankara, I’d recommend visiting the old town around the castle. You can take a bus to Ulus and walk up from there. Near the castle, you can explore the narrow streets and visit a small museum. There are also places to sit with a coffee and enjoy the view. Make sure you wear comfortable shoes because some of the streets are quite steep. If you’re free on Saturday, we could go together. See you, Erhan"]}};
const byId = id => document.getElementById(id);
let items=[], answers=[], position=0, deadline=0, timer=0, writing='';
function shuffle(values){
 const out=[...values];
 for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
 return out;
}
function addSkills(level){
 const s=skills[level];
 return ['r','l'].flatMap(key=>s[key].map(([stem,options,reason])=>({
  level, stem, options:options.split('|'), reason, script:key==='r'?s.read:s.listen,
  type:key==='r'?'Reading':'Listening'
 })));
}
function describe(){
 const level=byId('mode').value;
 const minutes=level==='A1'?45:55;
 byId('description').textContent=bank[level].length+' dil kullanımı · 4 okuma · 4 dinleme · 1 yazma · '+minutes+' dakika';
}
const chosenLevel = new URLSearchParams(location.search).get('level');
if (['A1', 'A1+', 'A2'].includes(chosenLevel)) byId('mode').value = chosenLevel;
byId('mode').onchange = describe;
describe();
byId('start').onclick=()=>{
 const level=byId('mode').value;
 const minutes=level==='A1'?45:55;
 items=[...bank[level],...addSkills(level)].map(q=>({...q,correct:q.options[0],options:shuffle(q.options)}));
 answers=items.map(()=>null);position=0;writing='';deadline=Date.now()+minutes*60000;
 byId('setup').hidden=true;byId('results').hidden=true;byId('exam').hidden=false;
 clearInterval(timer);timer=setInterval(tick,250);render();tick();
};
function writingTask(box,withInput){
 const [range,prompt,requirements]=skills[byId('mode').value].write;
 node('h3','Writing · '+range+' words',box);
 node('p',prompt,box);
 const list=node('ul','',box);
 requirements.split('|').forEach(requirement=>node('li',requirement,list));
 if(!withInput)return;
 const draft=node('textarea','',box);
 draft.rows=8; draft.setAttribute('aria-label','Writing response'); draft.value=writing;
 const count=node('p','',box);
 const update=()=>{writing=draft.value;count.textContent=(writing.trim().match(/\S+/g)||[]).length+' kelime';};
 draft.addEventListener('input',update); update();
}
function tick(){
 const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 byId('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left===0) finish();
}
function node(tag,text,parent){
 const el=document.createElement(tag);el.textContent=text;parent.append(el);return el;
}
function render(){
 const q=items[position], box=byId('question');
 if(!q){
  box.replaceChildren();byId('progress').textContent='Writing · Son bölüm';
  writingTask(box,true);byId('prev').disabled=false;byId('next').disabled=true;renderJump();return;
 }
 box.replaceChildren();byId('progress').textContent=(position+1)+' / '+items.length+' · '+q.level+' · '+(q.type||'Use of English');
 if(q.type==='Reading')node('p',q.script,box).className='reading';
 if(q.type==='Listening'){
  const play=node('button','Dinle',box);
  play.onclick=()=>{
   if(!('speechSynthesis' in window)){play.textContent='Bu tarayıcıda ses desteği yok';return;}
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(q.script);u.lang='en-GB';u.rate=.87;speechSynthesis.speak(u);
  };
 }
 const f=node('fieldset','',box);node('legend',q.stem,f);
 q.options.forEach(o=>{
  const l=node('label','',f);l.className='option';
  const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[position]===o;
  input.onchange=()=>{answers[position]=o;renderJump();};
  l.append(input,document.createTextNode(' '+o));
 });
 byId('prev').disabled=position===0;byId('next').disabled=false;renderJump();
}
function renderJump(){
 const box=byId('jump');box.replaceChildren();
 items.forEach((_,i)=>{
  const b=node('button',String(i+1),box);
  if(answers[i]!==null)b.className='answered';
  b.setAttribute('aria-current',String(i===position));
  b.onclick=()=>{position=i;render();};
 });
 const w=node('button','Writing',box);
 if(writing.trim())w.className='answered';
 w.setAttribute('aria-current',String(position===items.length));
 w.onclick=()=>{position=items.length;render();};
}
byId('prev').onclick=()=>{position--;render();};
byId('next').onclick=()=>{position++;render();};
byId('finish').onclick=()=>{
 const missing=answers.filter(a=>a===null).length;
 const note=(missing?missing+' test sorusu boş. ':'')+(!writing.trim()?'Writing görevi boş. ':'');
 if(confirm(note+'Sınavı bitir?'))finish();
};
function finish(){
 clearInterval(timer);
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const box=byId('results');box.replaceChildren();
 byId('exam').hidden=true;box.hidden=false;
 const tally={};let total=0;
 items.forEach((q,i)=>{
  const label=q.type||'Use of English';
  const t=tally[label]??={right:0,count:0};t.count++;
  if(q.correct===answers[i]){t.right++;total++;}
 });
 node('h2','Test sonucu · '+total+' / '+items.length+' · %'+Math.round(100*total/items.length),box);
 Object.entries(tally).forEach(([label,t])=>node('p',label+' · '+t.right+'/'+t.count,box));
 const review=node('details','',box);node('summary','Cevap anahtarı ve açıklamalar',review);
 items.forEach((q,i)=>{
  const entry=node('section','',review);
  node('strong',(q.correct===answers[i]?'✓ ':'✗ ')+(i+1)+'. '+q.stem,entry);
  node('p','Cevabın: '+(answers[i]||'Boş')+' · Doğru: '+q.correct,entry);
  node('p',q.reason,entry);
  if(q.unit)node('p',(q.level==='A2'?'Language Hub':'Müfredat')+' · Ünite '+q.unit+' — '+topics[q.level][q.unit-1],entry);
 });
 const transcription=node('details','',box);node('summary','Dinleme metni',transcription);
 node('p',skills[byId('mode').value].listen,transcription);
 writingTask(box,false);
 node('p',writing.trim()||'Yazma görevi boş bırakıldı.',box).style.whiteSpace='pre-wrap';
 const example=node('details','',box);node('summary','Örnek yazıyı göster',example);
 node('p',skills[byId('mode').value].write[3],example);
 const rubric=node('section','',box);
 node('h3','Yazma · Öz değerlendirme',rubric);
 node('p','Her ölçüte 0–5 puan ver. 0 = göreve ilişkin kanıt yok, 3 = anlaşılır ama eksikler var, 5 = hedef düzeyde ve tutarlı.',rubric);
 const measures=['Görev: Üç yönergeyi de karşıladım.','Düzen: Metni türüne uygun ve anlaşılır sıraladım.','Dil bilgisi: Hatalar anlamı engellemiyor.','Kelime: Konuya ve duruma uygun ifadeler kullandım.'];
 const scores=measures.map(label=>{
  const row=node('p','',rubric), field=node('label',label+' ',row), select=node('select','',field);
  const placeholder=node('option','Puan seç',select);placeholder.value='';
  for(let i=0;i<=5;i++)node('option',String(i),select);
  select.disabled=!writing.trim();return select;
 });
 const writingScore=node('p',writing.trim()?'Öz değerlendirme için dört ölçütü puanla.':'Yazılı cevap olmadan puan verilmez.',rubric);
 scores.forEach(select=>select.onchange=()=>{
  writingScore.textContent=scores.every(s=>s.value!=='')?'Yazma öz değerlendirmesi: '+scores.reduce((sum,s)=>sum+Number(s.value),0)+'/20':'Öz değerlendirme için dört ölçütü puanla.';
 });
 const again=node('button','Başka deneme seç',box);again.onclick=()=>{box.hidden=true;byId('setup').hidden=false;window.scrollTo(0,0);};
 window.scrollTo(0,0);
}
</script></main></html>
