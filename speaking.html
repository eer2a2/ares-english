<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2A38">
<link rel="manifest" href="./manifest-v60.webmanifest">
<title>Ares Speaking</title>
<style>
:root{--paper:#EFEAE0;--paper2:#E4DDCC;--ink:#1E2A38;--soft:#4B5A6B;--accent:#B4432B;--leaf:#5B7361;--gold:#B8892B;--card:#FBF8F1;--line:#C9C0AC;--dark:#1E2A38;--radius:14px;--shadow:0 5px 20px rgba(30,42,56,.10)}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background-image:linear-gradient(var(--paper2) 1px,transparent 1px);background-size:100% 32px} button,input,select,textarea{font:inherit} button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:0 10px 18px;border-bottom:1px solid #ffffff22}.brand h1{font-family:Georgia,serif;margin:0;font-size:24px}.brand p{margin:5px 0 0;color:#9fb0bf;font-size:12px}.nav{margin-top:14px}.nav button{width:100%;border:0;background:transparent;color:#dce4ea;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--accent);color:#fff}.legacy{display:block;margin:18px 10px 0;color:#b8c6d0;font-size:12px}.main{padding:28px 34px 70px;max-width:1150px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.top h2{font-family:Georgia,serif;font-size:32px;margin:0}.sub{color:var(--soft);font-size:13px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;color:var(--ink)}.pill.primary{background:var(--accent);color:white;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.card h3{margin:0 0 8px;font-family:Georgia,serif}.mission-step{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fffaf3;margin:9px 0}.stepno{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:white;font-weight:700}.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.modebar button.active{background:var(--dark);color:white}.prompt{font-family:Georgia,serif;font-size:24px;line-height:1.45;margin:14px 0}.rescue{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.answerbox{width:100%;min-height:95px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.timer{font-size:38px;font-weight:700;font-family:Georgia,serif;color:var(--accent)}.feedback{margin-top:12px;padding:12px;border-left:4px solid var(--leaf);background:#eef3ef;border-radius:8px;white-space:pre-wrap}.chat{height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.msg{max-width:82%;padding:10px 12px;border-radius:13px;margin:8px 0;line-height:1.45}.msg.ai{background:#edf0f2}.msg.me{background:#f5dfd7;margin-left:auto}.stat{padding:16px;border-radius:12px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:28px;font-family:Georgia,serif;color:var(--accent)}.tiny{font-size:12px;color:var(--soft)}.scenario-box{border:1px dashed var(--gold);border-radius:12px;padding:15px;background:#fffaf0}.mistake{border-bottom:1px solid var(--paper2);padding:10px 0}.progressbar{height:10px;background:var(--paper2);border-radius:999px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--leaf)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:flex;overflow:auto;gap:5px}.nav button{min-width:max-content;width:auto}.main{padding:20px 14px 70px}.top h2{font-size:27px}.legacy{margin-top:10px}.prompt{font-size:21px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><h1>🐾 Ares Speaking</h1><p>Study less. Speak more.</p></div><div class="nav" id="nav"><button data-view="mission" class="active">🎯 Today's Mission</button><button data-view="coach">🎤 Speaking Coach</button><button data-view="quick">⚡ Quick Response</button><button data-view="role">🎭 Role Play</button><button data-view="abroad">🌍 Abroad Simulation</button><button data-view="surprise">🎲 Surprise Me</button><button data-view="mistakes">🧠 My Mistakes</button><button data-view="progress">📈 Speaking Progress</button></div><a class="legacy" href="./index.html">← Eski çalışma defterini aç</a></aside><main class="main" id="main"></main></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; const KEY='ares_speaking_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{mode:'normal',spoken:0,minutes:0,streak:0,lastDay:'',mistakes:[],sessions:[],chat:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))} function today(){return new Date().toISOString().slice(0,10)}
function touchSession(seconds=60){state.spoken++;state.minutes+=seconds/60;const t=today();if(state.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);const yd=y.toISOString().slice(0,10);state.streak=state.lastDay===yd?state.streak+1:1;state.lastDay=t}state.sessions.push({d:t,s:seconds});if(state.sessions.length>300)state.sessions.shift();save()}
const chunks=[['I\'d like to…','kibarca istek belirtmek'],['Could you tell me…?','bilgi istemek'],['I\'m looking for…','bir şey/yer aramak'],['As far as I know…','bildiğim kadarıyla'],['The best part was…','en iyi kısmı anlatmak'],['I\'ve been to…','deneyim anlatmak'],['I ended up…','sonunda beklenmedik şekilde'],['It depends on…','duruma bağlı demek'],['I see your point, but…','kibarca karşı çıkmak'],['What I mean is…','kendini açıklamak']];
const quickQs=['What did you do after work yesterday?','What do you usually do when you feel tired?','Describe your perfect weekend in three sentences.','What is something you have changed your mind about recently?','If you could live in another city for a year, where would you choose and why?','What makes a café good for you?','Tell me one thing you are looking forward to.','What was the best part of your last trip?','What do you do when you cannot find the right English word?','Which is more important: speaking correctly or speaking confidently? Why?'];
const surprisePrompts=['Your friend wants to cancel a weekend trip because the weather looks bad. Convince them to go.','A waiter brings the wrong meal. Explain the problem politely and ask for a solution.','Someone you have just met asks why you are learning English. Answer naturally and ask them a question back.','You missed your train. Ask a station employee what your options are.','Tell someone how your life changed after you got a pet.','Your hotel room is noisy. Call reception and ask for another room.','A stranger asks for a recommendation for a good café in your city.','You bought something but realized it is the wrong size. Return it to the shop.'];
const abroad=[{cat:'Airport & Passport',place:'London',p:'The officer asks why you are visiting and how long you will stay. Answer naturally, then handle one follow-up question.'},{cat:'Hotel',place:'Rome',p:'The receptionist cannot find your reservation. Explain that you booked two months ago and solve the problem.'},{cat:'Restaurant',place:'Barcelona',p:'You ordered grilled fish but received pasta. Explain the mistake politely and ask how long the correct meal will take.'},{cat:'Train',place:'Berlin',p:'You realize you are on the wrong train. Ask another passenger or staff member what you should do.'},{cat:'Café',place:'Paris',p:'Your coffee order is wrong. Ask for the drink you originally ordered without sounding rude.'},{cat:'Directions',place:'Prague',p:'Your phone battery is dead. Ask a local how to get to the old town by public transport.'},{cat:'Socialising',place:'Dublin',p:'Someone at a pub starts small talk. Introduce yourself, keep the conversation going, and ask two questions back.'},{cat:'Language school',place:'Malta',p:'A classmate asks why you chose this school and what you want to improve. Answer and continue the conversation.'}];
function apiKey(){for(const k of ['ing_defter_api_key','ing_defter_api_key_local_backup','gemini_api_key','api_key','claude_api_key','ing_api_key']){try{const v=localStorage.getItem(k);if(v)return v}catch(e){}}return ''}
async function gemini(system,user){const key=apiKey();if(!key)throw new Error('NO_KEY');for(const m of ['gemini-2.5-flash','gemini-2.5-flash-lite']){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:500,temperature:.6}})});if(r.ok){const d=await r.json();return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim()}}throw new Error('API')}
function voiceSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)} let rec=null;
function startVoice(id){const out=document.getElementById(id);if(!voiceSupported()){alert('Bu tarayıcı ses tanımayı desteklemiyor.');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new R();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;let final='';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}out.value=(final+interim).trim()};rec.start()} function stopVoice(){if(rec)rec.stop()}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
function modeBar(){return `<div class="modebar"><b>Mode:</b><button class="pill ${state.mode==='guided'?'active':''}" onclick="setMode('guided')">🟢 Guided</button><button class="pill ${state.mode==='normal'?'active':''}" onclick="setMode('normal')">🟡 Real Life</button><button class="pill ${state.mode==='pressure'?'active':''}" onclick="setMode('pressure')">🔴 Pressure</button></div>`} function setMode(m){state.mode=m;save();render()}
function top(title,sub='Konuşma odaklı günlük çalışma'){return `<div class="top"><div><div class="sub">ARES SPEAKING</div><h2>${title}</h2><div class="sub">${sub}</div></div><div class="row"><span class="pill">🔥 ${state.streak} gün</span><span class="pill">🎤 ${state.spoken} cevap</span></div></div>`}
function rescueHtml(arr){if(state.mode==='pressure')return '';if(state.mode==='normal')return `<div class="tiny">İpucu istemeden önce 5 saniye düşün.</div>`;return `<div class="rescue">${arr.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`}
function viewMission(){const c=chunks[Math.floor(Date.now()/86400000)%chunks.length];return `${top("Today's Mission",'15 dakikada konuşma kasını çalıştır')}<div class="card"><h3>Bugünün hedefi</h3><div class="prompt">${c[0]}</div><div class="sub">${c[1]}. Bugün bu kalıbı en az 3 kez kullan.</div></div><div class="card">${[['Warm-up · 2 dk','Bugünün nasıl geçtiğini sesli anlat.'],["Today's Chunks · 3 dk",c[0]+' ile 3 farklı cümle kur.'],['Conversation · 5 dk','Ares Speaking Coach ile serbest konuş.'],['Quick Response · 2 dk','Düşünmeden kısa cevaplar ver.'],['Abroad Simulation · 3 dk','Gerçek hayat senaryosunu çöz.']].map((x,i)=>`<div class="mission-step"><div class="stepno">${i+1}</div><div><b>${x[0]}</b><div class="sub">${x[1]}</div></div></div>`).join('')}<div class="row" style="margin-top:14px"><button class="pill primary" onclick="go('coach')">Başla →</button></div></div>`}
function viewCoach(){return `${top('Speaking Coach','Ares seni konuşturur; küçük hatalarda akışı bozmaz')}${modeBar()}<div class="card"><div id="chat" class="chat">${state.chat.length?state.chat.map(m=>`<div class="msg ${m.r==='user'?'me':'ai'}">${esc(m.t)}</div>`).join(''):`<div class="msg ai">Hi Erhan! Tell me something about your day. I’ll keep the conversation moving and only correct important mistakes.</div>`}</div><textarea id="coachText" class="answerbox" placeholder="Speak or type in English..."></textarea><div class="row" style="margin-top:9px"><button class="pill" onclick="startVoice('coachText')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="sendCoach()">Gönder</button><button class="pill" onclick="newCoachTopic()">🔀 Konu değiştir</button></div><div id="coachStatus" class="tiny" style="margin-top:8px"></div></div>`}
async function sendCoach(){const box=$('#coachText'),txt=box?.value.trim();if(!txt)return;state.chat.push({r:'user',t:txt});touchSession(60);save();render();try{const hist=state.chat.slice(-8).map(x=>(x.r==='user'?'Learner: ':'Coach: ')+x.t).join('\n');const sys=`You are Ares, a speaking-first English coach for an A2-B1 Turkish learner. Prioritize fluency and communication. Do NOT correct tiny article/preposition/punctuation issues unless repeated or meaning-changing. Correct at most ONE important issue briefly, then continue naturally with exactly one follow-up question. Keep replies short, warm, natural, and mostly English. Current mode: ${state.mode}.`;const ans=await gemini(sys,hist);state.chat.push({r:'ai',t:ans});save();render();speak(ans)}catch(e){state.chat.push({r:'ai',t:e.message==='NO_KEY'?'API anahtarını eski uygulamadaki Ayarlar → AI API Anahtarı bölümüne bir kez girmen gerekiyor.':'AI bağlantısında sorun oldu.'});save();render()}}
function newCoachTopic(){state.chat.push({r:'ai',t:surprisePrompts[Math.floor(Math.random()*surprisePrompts.length)]});save();render()}
function viewQuick(){const q=quickQs[Math.floor(Math.random()*quickQs.length)];return `${top('Quick Response','5–10 saniyede cevap: amaç hız, kusursuzluk değil')}${modeBar()}<div class="card"><div class="timer" id="timer">${state.mode==='pressure'?5:state.mode==='guided'?10:7}</div><div class="prompt">${q}</div>${rescueHtml(['Actually…','I think…','For me…','It depends…'])}<textarea id="quickAns" class="answerbox"></textarea><div class="row" style="margin-top:9px"><button class="pill" onclick="startVoice('quickAns')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="touchSession(35);render()">Cevabı bitir</button><button class="pill" onclick="render()">Yeni soru</button></div></div>`}
function viewRole(){const s=abroad[Math.floor(Math.random()*abroad.length)];return `${top('Role Play','Ezber yok; doğal konuşma ve takip soruları')}${modeBar()}<div class="card"><div class="scenario-box"><b>🎭 ${s.cat}</b><div class="prompt">${s.p}</div><div class="sub">Konum: ${s.place}</div></div>${rescueHtml(['Excuse me…','Could you check…?','What should I do?'])}<textarea id="roleAns" class="answerbox"></textarea><div class="row" style="margin-top:9px"><button class="pill" onclick="startVoice('roleAns')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="touchSession(60);render()">Turu bitir</button></div></div>`}
function viewAbroad(){const s=abroad[Math.floor(Math.random()*abroad.length)];return `${top('🌍 Abroad Simulation','Herhangi bir ülkede gerçek hayat İngilizcesi')}${modeBar()}<div class="grid"><div class="card"><h3>${s.place} · ${s.cat}</h3><div class="prompt">${s.p}</div>${rescueHtml(['I need some help.','Could you please…?','What are my options?'])}<button class="pill primary" onclick="go('role')">Bu senaryoyu oyna →</button></div><div class="card"><h3>Zorluk mantığı</h3><p><b>🟢 Guided:</b> kalıp desteği.</p><p><b>🟡 Real Life:</b> ipucu yok.</p><p><b>🔴 Pressure:</b> hızlı cevap.</p><button class="pill" onclick="render()">🔀 Başka senaryo</button></div></div>`}
function viewSurprise(){const p=surprisePrompts[Math.floor(Math.random()*surprisePrompts.length)];return `${top('🎲 Surprise Me','Hazırlıksız konuşma')}${modeBar()}<div class="card"><div class="prompt">${p}</div>${rescueHtml(['Well…','Actually…','The thing is…','What I mean is…'])}<textarea id="surAns" class="answerbox"></textarea><div class="row" style="margin-top:9px"><button class="pill" onclick="startVoice('surAns')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="touchSession(90);render()">Bitir</button><button class="pill" onclick="render()">🎲 Yenisi</button></div></div>`}
function viewMistakes(){return `${top('My Mistakes','Önemli tekrar noktaları')}<div class="card">${state.mistakes.length?state.mistakes.map(m=>`<div class="mistake">${esc(m)}</div>`).join(''):'<div class="feedback">Henüz kayıtlı önemli hata yok.</div>'}</div>`}
function viewProgress(){const mins=Math.round(state.minutes);const week=state.sessions.filter(x=>Date.now()-new Date(x.d).getTime()<7*86400000).length;const goal=Math.min(100,Math.round(week/20*100));return `${top('Speaking Progress','Konuştuğun ölçülür')}<div class="grid"><div class="stat"><b>${state.spoken}</b>Toplam cevap</div><div class="stat"><b>${mins}</b>Dakika</div><div class="stat"><b>${state.streak}</b>Günlük seri</div></div><div class="card"><h3>Bu hafta</h3><div class="progressbar"><span style="width:${goal}%"></span></div><p class="sub">${week}/20 konuşma turu · %${goal}</p></div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const views={mission:viewMission,coach:viewCoach,quick:viewQuick,role:viewRole,abroad:viewAbroad,surprise:viewSurprise,mistakes:viewMistakes,progress:viewProgress};let current='mission';function go(v){current=v;render()}function render(){$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===current));$('#main').innerHTML=(views[current]||viewMission)();if(current==='coach'){setTimeout(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight},0)}}$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)});render();
</script>
</body></html>
