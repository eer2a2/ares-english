*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background-image:linear-gradient(var(--paper2) 1px,transparent 1px);background-size:100% 32px} button,input,select,textarea{font:inherit} button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:0 10px 18px;border-bottom:1px solid #ffffff22}.brand h1{font-family:Georgia,serif;margin:0;font-size:24px}.brand p{margin:5px 0 0;color:#9fb0bf;font-size:12px}.nav{margin-top:14px}.nav button{width:100%;border:0;background:transparent;color:#dce4ea;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--accent);color:#fff}.legacy{display:block;margin:18px 10px 0;color:#b8c6d0;font-size:12px}.main{padding:28px 34px 70px;max-width:1150px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.top h2{font-family:Georgia,serif;font-size:32px;margin:0}.sub{color:var(--soft);font-size:13px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;color:var(--ink)}.pill.primary{background:var(--accent);color:white;border-color:var(--accent)}.pill.good{background:var(--leaf);color:white;border-color:var(--leaf)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.card h3{margin:0 0 8px;font-family:Georgia,serif}.mission-step{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fffaf3;margin:9px 0}.stepno{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:white;font-weight:700}.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.modebar button.active{background:var(--dark);color:white}.prompt{font-family:Georgia,serif;font-size:24px;line-height:1.45;margin:14px 0}.rescue{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.answerbox{width:100%;min-height:95px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.timer{font-size:38px;font-weight:700;font-family:Georgia,serif;color:var(--accent)}.feedback{margin-top:12px;padding:12px;border-left:4px solid var(--leaf);background:#eef3ef;border-radius:8px;white-space:pre-wrap;line-height:1.5}.warn{border-left-color:var(--gold);background:#fff8e8}.chat{height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.msg{max-width:84%;padding:10px 12px;border-radius:13px;margin:8px 0;line-height:1.45;white-space:pre-wrap}.msg.ai{background:#edf0f2}.msg.me{background:#f5dfd7;margin-left:auto}.stat{padding:16px;border-radius:12px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:28px;font-family:Georgia,serif;color:var(--accent)}.tiny{font-size:12px;color:var(--soft)}.scenario-box{border:1px dashed var(--gold);border-radius:12px;padding:15px;background:#fffaf0}.mistake{border-bottom:1px solid var(--paper2);padding:12px 0}.mistake:last-child{border-bottom:0}.progressbar{height:10px;background:var(--paper2);border-radius:999px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--leaf)} select.full{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}.listen{display:inline-flex;align-items:center;gap:6px}.dotlive{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}.divider{height:1px;background:var(--paper2);margin:14px 0}.kbd{font-family:monospace;background:var(--paper2);padding:2px 6px;border-radius:5px}.session-title{font-weight:700;margin-bottom:5px}.score{font-size:42px;font-family:Georgia,serif;color:var(--accent);font-weight:700}

<body>
<div class="app"><aside class="side"><div class="brand"><h1>🐾 Ares Speaking</h1><p>Study less. Speak more.</p></div><div class="nav" id="nav"><button data-view="mission" class="active">🎯 Today's Mission</button><button data-view="coach">🎤 Speaking Coach</button><button data-view="quick">⚡ Quick Response</button><button data-view="role">🎭 Role Play</button><button data-view="abroad">🌍 Abroad Simulation</button><button data-view="surprise">🎲 Surprise Me</button><button data-view="mistakes">🧠 My Mistakes</button><button data-view="progress">📈 Speaking Progress</button></div><a class="legacy" href="./index.html">← Eski çalışma defterini aç</a></aside><main class="main" id="main"></main></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='ares_speaking_v2';
const DEFAULT={mode:'normal',spoken:0,minutes:0,streak:0,lastDay:'',mistakes:[],sessions:[],chat:[],quickIndex:0,role:null,roleChat:[],abroad:null,abroadChat:[]};
const state=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(KEY)||'null')||{});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function touchSession(seconds=60,type='practice'){state.spoken++;state.minutes+=seconds/60;const t=today();if(state.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);const yd=y.toISOString().slice(0,10);state.streak=state.lastDay===yd?state.streak+1:1;state.lastDay=t}state.sessions.push({d:t,s:seconds,type});if(state.sessions.length>500)state.sessions.shift();save()}

const chunks=[
["I'd like to…",'kibarca istek belirtmek'],['Could you tell me…?','bilgi istemek'],["I'm looking for…",'bir şey/yer aramak'],['As far as I know…','bildiğim kadarıyla'],['The best part was…','en iyi kısmı anlatmak'],["I've been to…",'deneyim anlatmak'],['I ended up…','sonunda beklenmedik şekilde'],['It depends on…','duruma bağlı demek'],['I see your point, but…','kibarca karşı çıkmak'],['What I mean is…','kendini açıklamak'],['To be honest…','doğal giriş yapmak'],['Actually…','düzeltme veya ek bilgi vermek'],['The thing is…','açıklamaya giriş yapmak'],['Give me a second…','zaman kazanmak'],['Let me think…','düşünmek için süre kazanmak'],['It sounds like…','izlenim belirtmek'],['From my point of view…','görüş belirtmek'],['I’m not sure, but…','emin olmadan cevaplamak'],['What I’m trying to say is…','kendini yeniden ifade etmek'],['That makes sense, but…','kibarca farklı görüş belirtmek']];
const quickQs=[
'What did you do after work yesterday?','What do you usually do when you feel tired?','Describe your perfect weekend in three sentences.','What is something you have changed your mind about recently?','If you could live in another city for a year, where would you choose and why?','What makes a café good for you?','Tell me one thing you are looking forward to.','What was the best part of your last trip?','What do you do when you cannot find the right English word?','Which is more important: speaking correctly or speaking confidently? Why?','What is one habit you would like to change?','Describe a person you enjoy talking to.','What was the last thing that made you laugh?','Would you rather travel alone or with friends? Why?','What is one thing tourists should do in your city?','What kind of weather gives you energy?','What do you usually do on Sunday mornings?','Tell me about a small problem you solved recently.','What makes a good manager?','What is something you are proud of learning?','What is one place you would happily visit again?','What do you usually order in a café?','How do you relax after a stressful day?','What is a movie you could watch again?','If you had a free day tomorrow, what would you do?','What do you enjoy about travelling abroad?','What is one English phrase you use often?','What is harder for you: starting a conversation or keeping it going?','Describe your morning in five sentences.','What do you usually do when your plans suddenly change?'];
const surprisePrompts=[
'Your friend wants to cancel a weekend trip because the weather looks bad. Convince them to go.','A waiter brings the wrong meal. Explain the problem politely and ask for a solution.','Someone you have just met asks why you are learning English. Answer naturally and ask them a question back.','You missed your train. Ask a station employee what your options are.','Tell someone how your life changed after you got a pet.','Your hotel room is noisy. Call reception and ask for another room.','A stranger asks for a recommendation for a good café in your city.','You bought something but realized it is the wrong size. Return it to the shop.','A colleague disagrees with your idea. Respond politely and explain your point.','You are late for a meeting because of traffic. Explain what happened.','You meet another traveller at breakfast. Start a conversation and keep it going.','Your phone battery is almost dead and you need directions. Ask someone for help.','A tourist asks what food they should try in Türkiye. Recommend something.','Your flight has been delayed for four hours. Ask airline staff about your options.','You do not understand a question in English. Ask the speaker to repeat or rephrase it.','A friend says learning English after 40 is too difficult. Respond to them.','You are checking out of a hotel and notice an extra charge. Ask about it.','You want a quieter table in a crowded restaurant. Ask politely.','Explain your job to someone who knows nothing about public administration.','A new classmate asks what you hope to achieve by the end of an English course.'];
const abroad=[
{cat:'Airport & Passport',place:'London',role:'Immigration officer',p:'The officer asks why you are visiting and how long you will stay.',starter:'Good afternoon. May I see your passport? What is the purpose of your visit?'},
{cat:'Airport & Passport',place:'Dublin',role:'Immigration officer',p:'The officer wants to know where you are staying and when you will leave.',starter:'Where will you be staying, and when are you flying back?'},
{cat:'Airport',place:'Rome',role:'Airline employee',p:'Your checked bag did not arrive.',starter:'Hello. How can I help you?'},
{cat:'Hotel',place:'Rome',role:'Receptionist',p:'The receptionist cannot find your reservation.',starter:'I’m sorry, but I can’t find a reservation under your name.'},
{cat:'Hotel',place:'Paris',role:'Receptionist',p:'Your room is too noisy at night.',starter:'Good evening. Reception. How can I help?'},

{cat:'Restaurant',place:'Barcelona',role:'Waiter',p:'You ordered grilled fish but received pasta.',starter:'Is everything okay with your meal?'},
{cat:'Restaurant',place:'Palermo',role:'Waiter',p:'You want a recommendation for a local dish and have one question about ingredients.',starter:'Are you ready to order, or would you like a recommendation?'},
{cat:'Café',place:'Paris',role:'Barista',p:'Your coffee order is wrong.',starter:'Here’s your latte. Anything else?'},
{cat:'Train',place:'Berlin',role:'Train staff',p:'You realize you are on the wrong train.',starter:'Tickets, please. Is there a problem?'},
{cat:'Train',place:'Prague',role:'Station employee',p:'You missed your connection and need the next option.',starter:'Hello. Where are you trying to get to?'},
{cat:'Directions',place:'Prague',role:'Local resident',p:'Your phone battery is dead. You need public transport directions to the old town.',starter:'Hi. You look a little lost. Can I help?'},

{cat:'Shopping',place:'Madrid',role:'Shop assistant',p:'You want another size and want to know whether the item is on sale.',starter:'Would you like to try a different size?'},

{cat:'Language school',place:'Malta',role:'Teacher',p:'It is your first day. The teacher asks about your goals and speaking difficulties.',starter:'Welcome! What would you most like to improve while you’re here?'},
{cat:'Pharmacy',place:'Amsterdam',role:'Pharmacist',p:'You need a simple over-the-counter product and must explain what you need.',starter:'Hello. What can I help you with?'},
{cat:'Taxi',place:'Athens',role:'Taxi driver',p:'You need to reach the airport and want to confirm the approximate travel time.',starter:'Where are you heading?'},
{cat:'Museum',place:'Florence',role:'Ticket clerk',p:'You want to know whether a timed ticket includes a special exhibition.',starter:'Hello. Which ticket would you like?'}];

function apiKey(){for(const k of ['ing_defter_api_key','ing_defter_api_key_local_backup','gemini_api_key','api_key','claude_api_key','ing_api_key']){try{const v=localStorage.getItem(k);if(v)return v}catch(e){}}return ''}
function setKey(){const old=apiKey();const v=prompt('Gemini API anahtarını gir:',old||'');if(v){localStorage.setItem('ing_defter_api_key',v.trim());localStorage.setItem('ing_defter_api_key_local_backup',v.trim());alert('API anahtarı kaydedildi.')}}
async function gemini(system,user){const key=apiKey();if(!key)throw new Error('NO_KEY');let last='';for(const m of ['gemini-2.5-flash','gemini-2.5-flash-lite']){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:650,temperature:.65}})});if(r.ok){const d=await r.json();return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim()}last=await r.text()}catch(e){last=String(e)}}throw new Error('API '+last)}

let rec=null, listening=false, activeVoiceTarget='';
function voiceSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function startVoice(id){const out=document.getElementById(id);if(!out)return;if(!voiceSupported()){alert('Bu tarayıcı ses tanımayı desteklemiyor. Chrome kullanmayı dene.');return}stopVoice();const R=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new R();activeVoiceTarget=id;rec.lang='en-US';rec.interimResults=true;rec.continuous=true;let final=out.value?out.value.trim()+' ':'';listening=true;showListening(id,true);rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}out.value=(final+interim).trim()};rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;showListening(id,false);alert('Mikrofon izni gerekiyor.')} };rec.onend=()=>{if(listening){setTimeout(()=>{try{rec.start()}catch(e){}},250)}else showListening(id,false)};try{rec.start()}catch(e){}}
function stopVoice(){listening=false;if(rec){try{rec.stop()}catch(e){}}if(activeVoiceTarget)showListening(activeVoiceTarget,false)}
function showListening(id,on){const el=document.querySelector(`[data-listen-for="${id}"]`);if(el)el.innerHTML=on?'<span class="dotlive"></span> Dinliyorum…':'🎤 Konuş'}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}

function modeBar(){return `<div class="modebar"><b>Mode:</b><button class="pill ${state.mode==='guided'?'active':''}" onclick="setMode('guided')">🟢 Guided</button><button class="pill ${state.mode==='normal'?'active':''}" onclick="setMode('normal')">🟡 Real Life</button><button class="pill ${state.mode==='pressure'?'active':''}" onclick="setMode('pressure')">🔴 Pressure</button></div>`}
function setMode(m){state.mode=m;save();render()}
function top(title,sub='Konuşma odaklı günlük çalışma'){return `<div class="top"><div><div class="sub">ARES SPEAKING</div><h2>${title}</h2><div class="sub">${sub}</div></div><div class="row"><span class="pill">🔥 ${state.streak} gün</span><span class="pill">🎤 ${state.spoken} cevap</span><button class="pill" onclick="setKey()">🔑 API</button></div></div>`}
function rescueHtml(arr){if(state.mode==='pressure')return '';if(state.mode==='normal')return `<div class="tiny">İpucu istemeden önce 5 saniye düşün. Takılırsan: <span class="kbd">Let me think…</span></div>`;return `<div class="rescue">${arr.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`}
function go(v){stopVoice();document.querySelector(`[data-view="${v}"]`)?.click()}
function apiNotice(){return apiKey()?'':`<div class="feedback warn"><b>AI için API anahtarı bulunamadı.</b><br>Eski Ares uygulamasında kayıtlı anahtar aynı alan adındaysa otomatik gelir. Gelmediyse sağ üstteki <b>🔑 API</b> düğmesine bir kez girmen yeterli.</div>`}

function viewMission(){const c=chunks[Math.floor(Date.now()/86400000)%chunks.length];return `${top("Today's Mission",'15 dakikada konuşma kasını çalıştır')}<div class="card"><h3>Bugünün kalıbı</h3><div class="prompt">${c[0]}</div><div class="sub">${c[1]}. Bugün bu kalıbı en az 3 kez kullan.</div></div><div class="card">${[['Warm-up · 2 dk','Bugünün nasıl geçtiğini sesli anlat.'],["Today's Chunk · 3 dk",c[0]+' ile 3 farklı cümle kur.'],['Conversation · 5 dk','Ares Speaking Coach ile serbest konuş.'],['Quick Response · 2 dk','5–10 saniyede kısa cevaplar ver.'],['Abroad Simulation · 3 dk','Gerçek hayat senaryosunu karşılıklı çöz.']].map((x,i)=>`<div class="mission-step"><div class="stepno">${i+1}</div><div><b>${x[0]}</b><div class="sub">${x[1]}</div></div></div>`).join('')}<div class="row" style="margin-top:14px"><button class="pill primary" onclick="go('coach')">Başla →</button></div></div>`}

function viewCoach(){return `${top('Speaking Coach','Ares seni konuşturur; küçük hatalarda akışı bozmaz')}${modeBar()}${apiNotice()}<div class="card"><div id="chat" class="chat">${state.chat.length?state.chat.map(m=>`<div class="msg ${m.r==='user'?'me':'ai'}">${esc(m.t)}</div>`).join(''):`<div class="msg ai">Hi Erhan! Tell me something about your day. I’ll keep the conversation moving and only correct important mistakes.</div>`}</div><textarea id="coachText" class="answerbox" placeholder="Speak or type in English..."></textarea><div class="row" style="margin-top:9px"><button class="pill listen" data-listen-for="coachText" onclick="startVoice('coachText')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="sendCoach()">Gönder</button><button class="pill" onclick="newCoachTopic()">🔀 Konu değiştir</button><button class="pill" onclick="clearCoach()">🧹 Temizle</button></div><div id="coachStatus" class="tiny" style="margin-top:8px"></div></div>`}
async function sendCoach(){stopVoice();const box=$('#coachText'),txt=box?.value.trim();if(!txt)return;state.chat.push({r:'user',t:txt});touchSession(60,'coach');save();render();setStatus('Düşünüyorum…');try{const hist=state.chat.slice(-10).map(x=>(x.r==='user'?'Learner: ':'Coach: ')+x.t).join('\n');const sys=`You are Ares, a speaking-first English coach for an A2-B1 Turkish learner. Main goal: keep the learner speaking. Prioritize fluency and communication over small grammar perfection. Do not correct tiny article, minor preposition, punctuation, or stylistic issues unless repeated or meaning-changing. Correct at most ONE important/core issue briefly. If there is an important correction, append a final line exactly in this format: CORE_FIX: original fragment => corrected fragment | very short Turkish note. If there is no important issue, append CORE_FIX: NONE. Before that marker, respond naturally in short conversational English and ask exactly ONE follow-up question. Keep it warm, realistic, and concise. Never lecture.`;const ans=await gemini(sys,hist);const clean=storeFixFromAI(ans,txt);state.chat.push({r:'ai',t:clean});save();render();setTimeout(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight},50);speak(clean.replace(/CORE_FIX:[\s\S]*/,'').trim())}catch(e){handleAIError(e)}}
function setStatus(t){const el=$('#coachStatus');if(el)el.textContent=t}
function handleAIError(e){const msg=String(e.message||e);if(msg.includes('NO_KEY'))alert('AI API anahtarı bulunamadı. Sağ üstteki 🔑 API düğmesine basıp anahtarı bir kez kaydet.');else alert('AI bağlantısında sorun oldu. Biraz sonra tekrar dene.');}
function newCoachTopic(){const p=rand([...quickQs,...surprisePrompts]);state.chat.push({r:'ai',t:p});save();render();speak(p)}
function clearCoach(){state.chat=[];save();render()}
function storeFixFromAI(ans,original){const m=ans.match(/CORE_FIX:\s*(.+)$/im);if(m&&m[1].trim().toUpperCase()!=='NONE'){const parts=m[1].split('|');const lr=parts[0].split('=>');if(lr.length===2){const item={id:Date.now(),date:today(),original:(lr[0]||original).trim(),fix:lr[1].trim(),note:(parts[1]||'Önemli yapı düzeltmesi').trim(),done:false};state.mistakes.unshift(item);if(state.mistakes.length>100)state.mistakes.pop();save()}}return ans.replace(/\n?CORE_FIX:[\s\S]*$/i,'').trim()}

let quickTimer=null,quickLeft=0,quickCurrent='';
function viewQuick(){if(!quickCurrent)quickCurrent=quickQs[state.quickIndex%quickQs.length];return `${top('Quick Response','Hedef: önce hız, sonra doğruluk')}${modeBar()}${apiNotice()}<div class="card"><div class="tiny">Soru</div><div class="prompt">${esc(quickCurrent)}</div>${rescueHtml(['Let me think…','I’d say…','Probably…','It depends…'])}<div class="row" style="margin:14px 0"><div class="timer" id="qtimer">${state.mode==='pressure'?5:10}</div><button class="pill" onclick="startQuickTimer()">⏱️ Başlat</button><button class="pill" onclick="nextQuick()">🔀 Yeni soru</button></div><textarea id="quickText" class="answerbox" placeholder="Cevabını söyle veya yaz..."></textarea><div class="row" style="margin-top:9px"><button class="pill listen" data-listen-for="quickText" onclick="startVoice('quickText')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="evalQuick()">Cevabı değerlendir</button></div><div id="quickFeedback"></div></div>`}
function startQuickTimer(){clearInterval(quickTimer);quickLeft=state.mode==='pressure'?5:10;const el=$('#qtimer');if(el)el.textContent=quickLeft;quickTimer=setInterval(()=>{quickLeft--;if(el)el.textContent=Math.max(0,quickLeft);if(quickLeft<=0){clearInterval(quickTimer);speak('Go!')}},1000)}
function nextQuick(){clearInterval(quickTimer);state.quickIndex=(state.quickIndex+1+Math.floor(Math.random()*5))%quickQs.length;quickCurrent=quickQs[state.quickIndex];save();render()}
async function evalQuick(){stopVoice();const txt=$('#quickText')?.value.trim();if(!txt)return;touchSession(40,'quick');const fb=$('#quickFeedback');fb.innerHTML='<div class="feedback">Değerlendiriyorum…</div>';try{const sys=`You are evaluating a quick spoken English response from an A2-B1 learner. Fluency first. Give exactly 3 short lines: 1) Communication: say if the answer was clear, 2) More natural: give ONE improved natural version, 3) Next challenge: one very short follow-up prompt. Ignore tiny article/preposition issues unless important. If there is one core error, append CORE_FIX: original fragment => corrected fragment | short Turkish note. Otherwise CORE_FIX: NONE.`;const ans=await gemini(sys,`Question: ${quickCurrent}\nLearner answer: ${txt}`);const clean=storeFixFromAI(ans,txt);fb.innerHTML=`<div class="feedback">${esc(clean)}</div>`;speak(clean)}catch(e){handleAIError(e)}}

function scenarioCard(sc){return `<div class="scenario-box"><div class="tiny">${esc(sc.cat)} · ${esc(sc.place)}</div><div class="prompt" style="font-size:21px">${esc(sc.p)}</div><div class="tiny">Sen kendinsin. Ares = <b>${esc(sc.role)}</b>.</div></div>`}
function rolePool(){return abroad.filter(x=>['Hotel','Restaurant','Café','Shopping','Socialising','Taxi','Museum'].includes(x.cat))}
function viewRole(){if(!state.role)state.role=rand(rolePool());save();return `${top('Role Play','Ares karşıdaki kişi olur; konuşma gerçek diyalog gibi ilerler')}${modeBar()}${apiNotice()}<div class="card">${scenarioCard(state.role)}<div class="row" style="margin-top:12px"><button class="pill" onclick="newRole()">🔀 Yeni rol</button><button class="pill" onclick="resetRole()">↺ Baştan</button></div></div>${dialogueBox('role')}`}
function viewAbroad(){if(!state.abroad)state.abroad=rand(abroad);save();return `${top('Abroad Simulation','Havaalanından sosyalleşmeye gerçek yurtdışı İngilizcesi')}${modeBar()}${apiNotice()}<div class="card">${scenarioCard(state.abroad)}<div class="row" style="margin-top:12px"><select class="full" style="max-width:330px" onchange="pickAbroad(this.value)"><option value="">Senaryo seç…</option>${[...new Set(abroad.map(x=>x.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="pill" onclick="newAbroad()">🎲 Rastgele</button><button class="pill" onclick="resetAbroad()">↺ Baştan</button></div></div>${dialogueBox('abroad')}`}
function dialogueBox(kind){const sc=state[kind],chat=state[kind+'Chat'];const starter=(chat&&chat.length)?'':sc.starter;return `<div class="card"><div id="${kind}Chat" class="chat">${starter?`<div class="msg ai">${esc(starter)}</div>`:''}${(chat||[]).map(m=>`<div class="msg ${m.r==='user'?'me':'ai'}">${esc(m.t)}</div>`).join('')}</div><textarea id="${kind}Text" class="answerbox" placeholder="Cevabını İngilizce söyle..."></textarea><div class="row" style="margin-top:9px"><button class="pill listen" data-listen-for="${kind}Text" onclick="startVoice('${kind}Text')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="sendScenario('${kind}')">Gönder</button><button class="pill good" onclick="finishScenario('${kind}')">🏁 Diyaloğu bitir & değerlendir</button></div><div id="${kind}Feedback"></div></div>`}
function newRole(){state.role=rand(rolePool());state.roleChat=[];save();render()}
function resetRole(){state.roleChat=[];save();render()}
function newAbroad(){state.abroad=rand(abroad);state.abroadChat=[];save();render()}
function resetAbroad(){state.abroadChat=[];save();render()}
function pickAbroad(cat){if(!cat)return;state.abroad=rand(abroad.filter(x=>x.cat===cat));state.abroadChat=[];save();render()}
async function sendScenario(kind){stopVoice();const txt=$(`#${kind}Text`)?.value.trim();if(!txt)return;const sc=state[kind],arr=state[kind+'Chat'];arr.push({r:'user',t:txt});touchSession(50,kind);save();render();const fb=$(`#${kind}Feedback`);if(fb)fb.innerHTML='<div class="tiny">Karşı taraf cevap veriyor…</div>';try{const hist=arr.slice(-10).map(x=>(x.r==='user'?'Traveller: ':'Other person: ')+x.t).join('\n');const sys=`You are role-playing as a ${sc.role} in ${sc.place}. Situation: ${sc.p}. Stay fully in character. Do NOT teach or correct the learner during the role-play. Respond in realistic, short B1-level English. Move the situation forward naturally and add one realistic follow-up question or complication when useful. Never provide translations. Keep each turn under 55 words.`;const ans=await gemini(sys,`Opening line was: ${sc.starter}\nConversation so far:\n${hist}\nRespond now as the ${sc.role}.`);arr.push({r:'ai',t:ans});save();render();speak(ans)}catch(e){handleAIError(e)}}
async function finishScenario(kind){stopVoice();const sc=state[kind],arr=state[kind+'Chat'];if(!arr.length){alert('Önce en az bir cevap ver.');return}const fb=$(`#${kind}Feedback`);fb.innerHTML='<div class="feedback">Konuşmayı değerlendiriyorum…</div>';try{const hist=arr.map(x=>(x.r==='user'?'Learner: ':'Other person: ')+x.t).join('\n');const sys=`Evaluate this A2-B1 learner's role-play. Fluency and communication are the priority. Give a compact report in Turkish with these headings only: "İletişim", "En iyi cümlen", "1 önemli düzeltme", "Daha doğal söyleyiş", "Bir sonraki hedef". Do not list tiny errors. Choose at most ONE core correction. End with SCORE: X/10 and then CORE_FIX: original fragment => corrected fragment | short Turkish note, or CORE_FIX: NONE.`;const ans=await gemini(sys,`Scenario: ${sc.cat} in ${sc.place}. ${sc.p}\n${hist}`);const clean=storeFixFromAI(ans,hist);fb.innerHTML=`<div class="feedback">${esc(clean)}</div>`;speak('Good job. Check your feedback on the screen.')}catch(e){handleAIError(e)}}

let surpriseCurrent='';
function viewSurprise(){if(!surpriseCurrent)surpriseCurrent=rand(surprisePrompts);return `${top('Surprise Me','Hazırlıksız konuşma: gerçek hayatta olduğu gibi')}${modeBar()}${apiNotice()}<div class="card"><div class="tiny">No preparation. Just speak.</div><div class="prompt">${esc(surpriseCurrent)}</div>${rescueHtml(['Give me a second…','The thing is…','What I mean is…'])}<textarea id="surpriseText" class="answerbox" placeholder="Hazır olunca konuş..."></textarea><div class="row" style="margin-top:9px"><button class="pill listen" data-listen-for="surpriseText" onclick="startVoice('surpriseText')">🎤 Konuş</button><button class="pill" onclick="stopVoice()">⏹️ Bitir</button><button class="pill primary" onclick="evalSurprise()">Değerlendir</button><button class="pill" onclick="newSurprise()">🎲 Başka sürpriz</button></div><div id="surpriseFeedback"></div></div>`}
function newSurprise(){let n=rand(surprisePrompts);while(n===surpriseCurrent&&surprisePrompts.length>1)n=rand(surprisePrompts);surpriseCurrent=n;render()}
async function evalSurprise(){stopVoice();const txt=$('#surpriseText')?.value.trim();if(!txt)return;touchSession(60,'surprise');const fb=$('#surpriseFeedback');fb.innerHTML='<div class="feedback">Değerlendiriyorum…</div>';try{const sys=`You are a speaking coach. Evaluate an A2-B1 learner's spontaneous answer. Fluency first. In Turkish, give: 1) Anlaşılırlık, 2) Güçlü taraf, 3) Sadece bir önemli düzeltme if needed, 4) One natural English version that still sounds like the learner, not advanced C1 English. End CORE_FIX: original => corrected | short Turkish note or CORE_FIX: NONE.`;const ans=await gemini(sys,`Prompt: ${surpriseCurrent}\nLearner: ${txt}`);const clean=storeFixFromAI(ans,txt);fb.innerHTML=`<div class="feedback">${esc(clean)}</div>`}catch(e){handleAIError(e)}}

function viewMistakes(){return `${top('My Mistakes','Sadece konuşmayı gerçekten etkileyen düzeltmeler burada birikir')}<div class="card"><div class="row"><button class="pill" onclick="clearMistakes()">🧹 Listeyi temizle</button></div><div class="divider"></div>${state.mistakes.length?state.mistakes.map((m,i)=>`<div class="mistake"><div class="tiny">${esc(m.date)}</div><div><b>Sen:</b> ${esc(m.original)}</div><div><b>Daha doğru:</b> ${esc(m.fix)}</div><div class="tiny">${esc(m.note)}</div><div class="row" style="margin-top:7px"><button class="pill" onclick="speak(${JSON.stringify(m.fix)})">🔊 Dinle</button><button class="pill" onclick="removeMistake(${i})">✓ Öğrendim</button></div></div>`).join(''):'<div class="sub">Henüz önemli bir hata kaydedilmedi. Bu iyi bir şey. 🙂</div>'}</div>`}
function removeMistake(i){state.mistakes.splice(i,1);save();render()}
function clearMistakes(){if(confirm('Kayıtlı düzeltmeler silinsin mi?')){state.mistakes=[];save();render()}}

function viewProgress(){const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-6);const cutoff=weekAgo.toISOString().slice(0,10);const w=state.sessions.filter(x=>x.d>=cutoff);const turns=w.length;const mins=w.reduce((a,b)=>a+b.s/60,0);const goal=20,pct=Math.min(100,Math.round(turns/goal*100));const byType={};w.forEach(x=>byType[x.type]=(byType[x.type]||0)+1);return `${top('Speaking Progress','Amaç puan değil: düzenli olarak ağzını açıp İngilizce üretmek')}<div class="grid"><div class="stat"><b>${state.spoken}</b>Toplam konuşma turu</div><div class="stat"><b>${Math.round(state.minutes)}</b>Yaklaşık dakika</div><div class="stat"><b>${state.streak}</b>Günlük seri</div><div class="stat"><b>${state.mistakes.length}</b>Tekrar edilecek önemli nokta</div></div><div class="card"><h3>Bu hafta</h3><div class="row"><div class="score">${turns}</div><div><b>/ ${goal} konuşma turu</b><div class="sub">${Math.round(mins)} dakika civarı aktif üretim</div></div></div><div class="progressbar" style="margin-top:14px"><span style="width:${pct}%"></span></div><div class="tiny" style="margin-top:7px">%${pct} haftalık hedef</div></div><div class="card"><h3>Dağılım</h3>${Object.keys(byType).length?Object.entries(byType).map(([k,v])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--paper2);padding:8px 0"><span>${esc(k)}</span><b>${v}</b></div>`).join(''):'<div class="sub">Bu hafta henüz kayıt yok.</div>'}</div>`}

const views={mission:viewMission,coach:viewCoach,quick:viewQuick,role:viewRole,abroad:viewAbroad,surprise:viewSurprise,mistakes:viewMistakes,progress:viewProgress};
let current='mission';
$$('#nav button').forEach(b=>b.onclick=()=>{stopVoice();current=b.dataset.view;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function render(){const fn=views[current]||viewMission;$('#main').innerHTML=fn();setTimeout(()=>{const c=$('#chat')||$('#roleChat')||$('#abroadChat');if(c)c.scrollTop=c.scrollHeight},20)}
render();
</script>
</body>
</html>
