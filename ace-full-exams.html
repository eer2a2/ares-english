const skills = {"A1": {"read": "Hi Marta, Can we meet at the new café on King Street on Saturday? It opens at ten, but I have a music lesson until eleven. Let’s meet at half past eleven. The café is opposite the library. Please bring the book I left at your house. See you, Alex", "listen": "Hello, this is Mill Road Sports Centre. The beginners’ swimming class is on Wednesday this week. It starts at six fifteen in the evening. Please arrive ten minutes early. You can borrow a towel at reception, but please bring your own swimming cap.", "r": [["When does Alex want to meet?", "11:30|10:00|11:00|10:30", "The proposal is half past eleven."], ["Where is the café?", "Opposite the library|Next to the library|Behind the library|Inside the library", "Opposite means across from."], ["What does Alex want Marta to bring?", "A book|A music ticket|A library card|A lesson notebook", "Alex asks for the book left at Marta’s house."], ["Why doesn’t Alex suggest meeting at ten?", "Alex has a music lesson.|The café is closed.|Marta is at the library.|The bookshop opens later.", "The lesson ends at eleven."]], "l": [["What day is the class this week?", "Wednesday|Tuesday|Thursday|Friday", "The message says Wednesday."], ["What time should students arrive?", "6:05|6:15|6:25|5:55", "Ten minutes before 6:15 is 6:05."], ["What can students borrow?", "A towel|A swimming cap|Swimming goggles|A locker key", "A towel is available at reception."], ["What must students bring?", "A swimming cap|A towel|A timetable|A swimming ticket", "The message asks them to bring their own cap."]], "write": ["35–50", "Write a short email to a friend who will visit you on Saturday.", "Say where and when to meet.|Explain how to get there.|Suggest one thing to do together.", "Hi Mia, Let’s meet outside the library at eleven on Saturday. Take bus number four and get off at the market. The library is next to the market. We can have lunch at the café in the park. See you on Saturday!"]}, "A1+": {"read": "On Saturday our group is visiting the old town. The guided walk was going to start at the station, but roadworks mean we’ll meet in front of the museum at 9:30 instead. The ticket includes entry to the museum. If you want lunch at the museum café, order before the walk. There’s also a small park nearby where you can eat your own food. It may rain, so bring a light jacket.", "listen": "Hi Maya, it’s Jo. I found a jacket for our walking trip. The blue one was cheaper, but it wasn’t waterproof, so I chose the grey one. The shop didn’t have my size, so they’re sending it to my home on Thursday. Could you bring the map on Saturday? I’ve already got the water bottles.", "r": [["Where should the group meet?", "In front of the museum|At the station|Inside the café|At the park entrance", "Roadworks changed the meeting point to the museum entrance."], ["What does the ticket cover?", "Museum entry|Lunch at the café|A jacket|Travel to the museum", "Entry is included; lunch is ordered separately."], ["What should you do if you want lunch from the café?", "Order before the walk.|Order at the station.|Order after visiting the park.|Order on the way home.", "The notice asks café customers to order before the walk."], ["Why is a jacket useful?", "It might rain.|The museum is cold.|You need it to enter.|The café has no seats.", "The final sentence mentions possible rain."]], "l": [["Why did Jo choose the grey jacket?", "It was waterproof.|It was cheaper.|It was in the right size at the shop.|It was lighter.", "Jo rejected the cheaper blue jacket because it wasn’t waterproof."], ["When is delivery expected?", "Thursday|Saturday|Wednesday|Friday", "Saturday is the trip; Thursday is the delivery."], ["What does Jo want Maya to bring?", "The map|The jacket|The water bottles|The tickets", "Jo asks for the map."], ["Why isn’t Jo taking the jacket home from the shop?", "The shop didn’t have the right size.|The jacket was too expensive.|It was only on sale on Thursday.|The shop had already closed.", "The shop didn’t have Jo’s size."]], "write": ["50–70", "Write an email to a shop about an item you bought online.", "Say what you ordered and when it arrived.|Explain the problem with the item.|Ask the shop to do one thing to help.", "Hello, I ordered a blue jacket last Monday and it arrived yesterday. I asked for a medium, but the jacket you sent is small. I like the colour and I would prefer to keep the same style. Could you send a medium and tell me how to return the small jacket? Thank you for your help."]}, "A2": {"read": "Last spring the Brookfield Park path was closed for repairs. The council planned to reopen it in June, but residents noticed that the old route passed through an area where ducks were nesting. After meeting local volunteers, the council decided to move part of the path farther from the lake. The new route takes five minutes longer, but it has a better view and a smoother surface. Some cyclists complained about the extra distance. However, the owner of a nearby café said more families had stopped there since the path reopened. Signs will be added next month, as some walkers are still following the old route.", "listen": "Good afternoon. This is a message for people who booked Saturday’s photography walk. The weather forecast is fine, so the walk is going ahead. However, the road beside the harbour is closed, and we’ll meet outside the main entrance to the museum instead. Please arrive at a quarter to ten so we can leave at ten. There’s no need to bring a professional camera. A phone is fine. If you borrowed a camera from us last week, please return it to the office on Friday, as the office won’t be open on Saturday morning.", "r": [["Why did the council move part of the route?", "To avoid disturbing nesting ducks|To make the route shorter|To give cyclists a faster route|To create more space for the café", "Residents identified nesting ducks near the original route."], ["How does the new route compare with the old one?", "It takes longer but is easier to walk on.|It’s shorter but has poorer views.|It’s the same length but closer to the lake.|It takes longer because its surface is rougher.", "The text says five minutes longer and smoother."], ["What change did the café owner notice?", "More families stopped at the café.|Fewer residents used the park.|More cyclists complained in the café.|Volunteers began opening the café on weekends.", "The owner reports more families stopping there."], ["Why will the council add signs?", "Some walkers still use the old route.|The council plans to close the lake.|Cyclists can’t see the café.|Families need to find the volunteers.", "The last sentence explains the reason for adding signs."]], "l": [["Why has the meeting point changed?", "A road is closed.|The weather forecast is bad.|The museum is closed.|There aren’t enough cameras.", "The harbour road closure caused the change."], ["When should participants get there?", "9:45|10:00|10:15|9:15", "A quarter to ten is 9:45. The group leaves at ten."], ["What equipment is acceptable?", "A phone|Only a professional camera|Only a borrowed camera|A camera and a phone together", "The organiser explicitly says a phone is fine."], ["Why should borrowed cameras be returned by Friday?", "The office will be closed on Saturday morning.|The walk has moved to Friday.|The organiser needs them during the walk.|The museum has stopped lending cameras.", "The office won’t open on Saturday morning."]], "write": ["80–100", "Write an email to a friend about a trip that did not go as planned.", "Describe your original plan and say what changed.|Explain how you dealt with the problem.|Say how the trip ended and what you would do differently next time.", "Hi Alex, Last Saturday we planned to take an early ferry and spend the whole day by the sea. The bus broke down, and by the time we reached the port, the ferry had already left. While we were waiting, we found a café and asked the owner what we could do nearby. She suggested a small museum, so we went there instead. In the end, we had a great afternoon and discovered a place we hadn’t heard of. Next time, I’d leave earlier and check the bus timetable. See you soon!"]}};

function addSkills(level){return [...practice[level].filter(q=>q.type==='Reading'),...practice[level].filter(q=>q.type==='Listening')];}
function describe(){
 const level=byId('mode').value;
 const minutes=level==='A1'?90:100;
 byId('description').textContent='80 dil kullanımı · 10 okuma · 10 dinleme · 1 yazma · '+minutes+' dakika';
}
const chosenLevel = new URLSearchParams(location.search).get('level');
if (['A1', 'A1+', 'A2'].includes(chosenLevel)) byId('mode').value = chosenLevel;
byId('mode').onchange = describe;
describe();
byId('start').onclick=()=>{
 const level=byId('mode').value;
 const minutes=level==='A1'?90:100;
 items=[...bank[level],...addSkills(level)].map(q=>({...q,correct:q.options[0],options:shuffle(q.options)}));
 answers=items.map(()=>null);position=0;writing='';deadline=Date.now()+minutes*60000;
 byId('setup').hidden=true;byId('results').hidden=true;byId('exam').hidden=false;
 clearInterval(timer);timer=setInterval(tick,250);render();tick();
};
function writingTask(box,withInput){
 const [range,prompt,requirements]=skills[byId('mode').value].write;
 node('h3','Writing · '+range+' words',box);
 node('p',prompt,box);
 const list=node('ul','',box);
 requirements.split('|').forEach(requirement=>node('li',requirement,list));
 if(!withInput)return;
 const draft=node('textarea','',box);
 draft.rows=8; draft.setAttribute('aria-label','Writing response'); draft.value=writing;
 const count=node('p','',box);
 const update=()=>{writing=draft.value;count.textContent=(writing.trim().match(/\S+/g)||[]).length+' kelime';};
 draft.addEventListener('input',update); update();
}
function tick(){
 const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 byId('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left===0) finish();
}
function node(tag,text,parent){
 const el=document.createElement(tag);el.textContent=text;parent.append(el);return el;
}
function render(){
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const q=items[position], box=byId('question');
 if(!q){
  box.replaceChildren();byId('progress').textContent='Writing · Son bölüm';
  writingTask(box,true);byId('prev').disabled=false;byId('next').disabled=true;renderJump();return;
 }
 box.replaceChildren();byId('progress').textContent=(position+1)+' / '+items.length+' · '+q.level+' · '+(q.type||'Use of English');
 if(q.type==='Reading')node('p',q.script,box).className='reading';
 if(q.type==='Listening'){
  const play=node('button','Dinle',box);
  play.onclick=()=>{
   if(!('speechSynthesis' in window)){play.textContent='Bu tarayıcıda ses desteği yok';return;}
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(q.script);u.lang='en-GB';u.rate=.87;speechSynthesis.speak(u);
  };
 }
 const f=node('fieldset','',box);node('legend',q.stem,f);
 q.options.forEach(o=>{
  const l=node('label','',f);l.className='option';
  const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[position]===o;
  input.onchange=()=>{answers[position]=o;renderJump();};
  l.append(input,document.createTextNode(' '+o));
 });
 byId('prev').disabled=position===0;byId('next').disabled=false;renderJump();
}
function renderJump(){
 const box=byId('jump');box.replaceChildren();
 items.forEach((_,i)=>{
  const b=node('button',String(i+1),box);
  if(answers[i]!==null)b.className='answered';
  b.setAttribute('aria-current',String(i===position));
  b.onclick=()=>{position=i;render();};
 });
 const w=node('button','Writing',box);
 if(writing.trim())w.className='answered';
 w.setAttribute('aria-current',String(position===items.length));
 w.onclick=()=>{position=items.length;render();};
}
byId('prev').onclick=()=>{position--;render();};
byId('next').onclick=()=>{position++;render();};
byId('finish').onclick=()=>{
 const missing=answers.filter(a=>a===null).length;
 const note=(missing?missing+' test sorusu boş. ':'')+(!writing.trim()?'Writing görevi boş. ':'');
 if(confirm(note+'Sınavı bitir?'))finish();
};
function finish(){
 clearInterval(timer);
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const box=byId('results');box.replaceChildren();
 byId('exam').hidden=true;box.hidden=false;
 const tally={};let total=0;
 items.forEach((q,i)=>{
  const label=q.type||'Use of English';
  const t=tally[label]??={right:0,count:0};t.count++;
  if(q.correct===answers[i]){t.right++;total++;}
 });
 node('h2','Test sonucu · '+total+' / '+items.length+' · %'+Math.round(100*total/items.length),box);
 Object.entries(tally).forEach(([label,t])=>node('p',label+' · '+t.right+'/'+t.count,box));
 const review=node('details','',box);node('summary','Cevap anahtarı ve açıklamalar',review);
 items.forEach((q,i)=>{
  const entry=node('section','',review);
  node('strong',(q.correct===answers[i]?'✓ ':'✗ ')+(i+1)+'. '+q.stem,entry);
  node('p','Cevabın: '+(answers[i]||'Boş')+' · Doğru: '+q.correct,entry);
  node('p',q.reason,entry);
  if(q.type==='Reading')node('p',q.script,entry);
  if(q.unit)node('p',(q.level==='A2'?'Language Hub':'Müfredat')+' · Ünite '+q.unit+' — '+topics[q.level][q.unit-1],entry);
 });
 const transcription=node('details','',box);node('summary','Dinleme metni',transcription);
 [...new Set(items.filter(q=>q.type==='Listening').map(q=>q.script))].forEach(script=>node('p',script,transcription));
 writingTask(box,false);
 node('p',writing.trim()||'Yazma görevi boş bırakıldı.',box).style.whiteSpace='pre-wrap';
 const example=node('details','',box);node('summary','Örnek yazıyı göster',example);
 node('p',skills[byId('mode').value].write[3],example);
 const rubric=node('section','',box);
 node('h3','Yazma · Öz değerlendirme',rubric);
 node('p','Her ölçüte 0–5 puan ver. 0 = göreve ilişkin kanıt yok, 3 = anlaşılır ama eksikler var, 5 = hedef düzeyde ve tutarlı.',rubric);
 const measures=['Görev: Üç yönergeyi de karşıladım.','Düzen: Metni türüne uygun ve anlaşılır sıraladım.','Dil bilgisi: Hatalar anlamı engellemiyor.','Kelime: Konuya ve duruma uygun ifadeler kullandım.'];
 const scores=measures.map(label=>{
  const row=node('p','',rubric), field=node('label',label+' ',row), select=node('select','',field);
  const placeholder=node('option','Puan seç',select);placeholder.value='';
  for(let i=0;i<=5;i++)node('option',String(i),select);
  select.disabled=!writing.trim();return select;
 });
 const writingScore=node('p',writing.trim()?'Öz değerlendirme için dört ölçütü puanla.':'Yazılı cevap olmadan puan verilmez.',rubric);
 scores.forEach(select=>select.onchange=()=>{
  writingScore.textContent=scores.every(s=>s.value!=='')?'Yazma öz değerlendirmesi: '+scores.reduce((sum,s)=>sum+Number(s.value),0)+'/20':'Öz değerlendirme için dört ölçütü puanla.';
 });
 const again=node('button','Başka deneme seç',box);again.onclick=()=>{box.hidden=true;byId('setup').hidden=false;window.scrollTo(0,0);};
 window.scrollTo(0,0);
}
</script></main></html>
